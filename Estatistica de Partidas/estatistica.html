<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas de Jogos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Estatísticas de Jogos</h1>
        <form id="form">
            <label for="jogos">Número total de jogos:</label>
            <input type="number" id="jogos" required>

            <label for="vitorias">Número de vitórias:</label>
            <input type="number" id="vitorias" required>

            <label for="empates">Número de empates:</label>
            <input type="number" id="empates" required>

            <label for="derrotas">Número de derrotas:</label>
            <input type="number" id="derrotas" required>

            <label for="golsFeitos">Número de gols feitos:</label>
            <input type="number" id="golsFeitos" required>

            <label for="golsSofridos">Número de gols sofridos:</label>
            <input type="number" id="golsSofridos" required>

            <button type="submit">Calcular</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
